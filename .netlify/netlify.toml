[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/sitemap*.xml"
to = "/index.html"
status = 404.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]