functionsDirectory = "/Users/PROJETOS DEV/PROMPT-APP/netlify/functions"
functionsDirectoryOrigin = "config"
headersOrigin = "config"
redirectsOrigin = "config"

[functions]

[functions."*"]
node_bundler = "esbuild"

[[plugins]]
origin = "ui"
package = "@netlify/plugin-lighthouse"
pinned_version = "6"

[plugins.inputs]

[build]
publish = "/Users/PROJETOS DEV/PROMPT-APP/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "pnpm install --frozen-lockfile && pnpm run build"
ignore = "    bash -c '\n      set -euo pipefail\n      if [ -z \"${CACHED_COMMIT_REF:-}\" ] || [ -z \"${COMMIT_REF:-}\" ]; then\n        echo \"[ignore] Sem CACHED_COMMIT_REF; permitindo build inicial.\"\n        exit 1\n      fi\n      if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then\n        echo \"[ignore] COMMIT_REF igual a CACHED_COMMIT_REF; pulando build.\"\n        exit 0\n      fi\n      CHANGED=\"$(git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" || true)\"\n      if [ -z \"$CHANGED\" ]; then\n        echo \"[ignore] Diff vazio; pulando build.\"\n        exit 0\n      fi\n      # Lista os arquivos do diff que NÃO casam com os padrões de ignore.\n      # Se essa lista for vazia, todos os arquivos alterados são irrelevantes\n      # para o bundle → pula o build (exit 0).\n      # Caso contrário, há pelo menos um arquivo relevante → executa o build (exit 1).\n      # Nota: Netlify convenciona exit 0 = skip, exit 1 = build.\n      # Ref: https://docs.netlify.com/configure-builds/ignore-builds/\n      RELEVANT=\"$(echo \"$CHANGED\" | grep -vE \"^(docs/|\\.github/|tests/|test-results/|playwright-report/|coverage/|\\.vscode/|\\.idea/|scripts/|logs/|backup-superpower/|customization/|.*\\.md$|.*\\.lock$|.*\\.log$|pnpm-lock\\.yaml$|\\.gitignore$|\\.npmrc$|LICENSE$|SECURITY\\.md$)\" || true)\"\n      if [ -z \"$RELEVANT\" ]; then\n        echo \"[ignore] Apenas arquivos irrelevantes alterados; pulando build.\"\n        echo \"$CHANGED\"\n        exit 0\n      fi\n      echo \"[ignore] Alterações relevantes detectadas; executando build.\"\n      echo \"$RELEVANT\"\n      exit 1\n    '\n  "
functions = "/Users/PROJETOS DEV/PROMPT-APP/netlify/functions"

[build.environment]
NODE_VERSION = "20"
CI = "true"

[build.processing]
skip_processing = true

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.ttf"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.otf"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io;"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.map"

[headers.values]
X-Robots-Tag = "noindex"
Cache-Control = "no-store"

