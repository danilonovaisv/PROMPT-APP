functionsDirectory = "/Users/PROJETOS DEV/PROMPT-APP/netlify/functions"
functionsDirectoryOrigin = "config"
headersOrigin = "config"
redirectsOrigin = "config"

[functions]

[functions."*"]
node_bundler = "esbuild"

[[plugins]]
origin = "ui"
package = "@netlify/plugin-lighthouse"
pinned_version = "6"

[plugins.inputs]

[build]
publish = "/Users/PROJETOS DEV/PROMPT-APP/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "pnpm install --frozen-lockfile && pnpm run build"
ignore = "bash -c 'if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; CHANGED=\"$(git diff --name-only \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\")\"; echo \"$CHANGED\" | grep -qvE \"^(docs/|\\.github/|tests/|.*\\.md$|.*\\.lock$)\"' "
functions = "/Users/PROJETOS DEV/PROMPT-APP/netlify/functions"

[build.environment]
NODE_VERSION = "20"
CI = "true"

[build.processing]
skip_processing = true

[build.processing.css]
bundle = false
minify = false

[build.processing.html]

[build.processing.images]
compress = false

[build.processing.js]
bundle = false
minify = false

[build.services]

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.sentry.io; img-src 'self' data: https:; frame-ancestors 'none'"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "http://prompt-app-dan.netlify.app/*"
to = "https://prompt-app-dan.netlify.app/:splat"
status = 301.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/assets/*.map"
to = "/404"
status = 404.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]