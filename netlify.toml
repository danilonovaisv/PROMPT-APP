[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"
  ignore = '''bash -c 'if [ -z "$CACHED_COMMIT_REF" ]; then exit 1; fi; CHANGED="$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF")"; echo "$CHANGED" | grep -qvE "^(docs/|\.github/|tests/|.*\.md$|.*\.lock$)"' '''

[build.environment]
  NODE_VERSION = "20"
  CI = "true"

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/sitemap*.xml"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.map"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
