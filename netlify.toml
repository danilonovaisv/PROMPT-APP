# Configuração de produção Netlify otimizada para {{FRAMEWORK}} detectado (Vite + React)

[build]
  # Build enxuto: somente compilação da aplicação
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"
  # Ignora builds para mudanças que não impactam deploy (docs, testes, CI e lockfiles)
  ignore = '''bash -c 'if [ -z "$CACHED_COMMIT_REF" ]; then exit 1; fi; CHANGED="$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF")"; echo "$CHANGED" | grep -qvE "^(docs/|\.github/|tests/|.*\.md$|.*\.lock$)"' '''

[build.environment]
  NODE_VERSION = "22"
  CI = "true"

[build.processing]
  # Evita processamento automático de assets para reduzir tempo/custo
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  # HTML sempre validado para evitar conteúdo stale
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.sentry.io; img-src 'self' data: https:; frame-ancestors 'none'"

[[headers]]
  # Assets versionados com cache agressivo e imutável
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  # Force HTTPS
  from = "http://prompt-app-dan.netlify.app/*"
  to = "https://prompt-app-dan.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  # Block public source maps
  from = "/assets/*.map"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  # SPA fallback para roteamento client-side
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
