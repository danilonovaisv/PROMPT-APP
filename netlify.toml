[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"
  # Ignore builds que não impactam o bundle publicado.
  # Pula o build se o diff entre o último commit publicado e o atual só
  # alterar arquivos de documentação, workflows, testes, lockfiles, etc.
  # Referência: https://docs.netlify.com/configure-builds/ignore-builds/
  ignore = '''
    bash -c '
      set -euo pipefail
      if [ -z "${CACHED_COMMIT_REF:-}" ] || [ -z "${COMMIT_REF:-}" ]; then
        echo "[ignore] Sem CACHED_COMMIT_REF; permitindo build inicial."
        exit 1
      fi
      if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then
        echo "[ignore] COMMIT_REF igual a CACHED_COMMIT_REF; pulando build."
        exit 0
      fi
      CHANGED="$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF" || true)"
      if [ -z "$CHANGED" ]; then
        echo "[ignore] Diff vazio; pulando build."
        exit 0
      fi
      # Se TODAS as linhas do diff casam com os padrões abaixo, pula o build.
      if echo "$CHANGED" | grep -qvE "^(docs/|\.github/|tests/|test-results/|playwright-report/|coverage/|\.vscode/|\.idea/|scripts/|logs/|backup-superpower/|customization/|.*\.md$|.*\.lock$|.*\.log$|pnpm-lock\.yaml$|\.gitignore$|\.npmrc$|LICENSE$|SECURITY\.md$)"; then
        echo "[ignore] Apenas arquivos irrelevantes alterados; pulando build."
        echo "$CHANGED"
        exit 0
      fi
      echo "[ignore] Alterações relevantes detectadas; executando build."
      exit 1
    '
  '''

[build.environment]
  NODE_VERSION = "20"
  CI = "true"

[build.processing]
  skip_processing = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Desabilita deploys de branches secundárias a nível de configuração.
# A configuração final ainda precisa ser validada no painel Netlify
# (Site configuration → Build & deploy → Branches and deploy contexts).
[context.production]
  command = "pnpm install --frozen-lockfile && pnpm run build"

[context.deploy-preview]
  # Mantém preview apenas se explicitamente solicitado. O painel Netlify
  # deve estar configurado como "None" em Deploy previews para economizar
  # minutos de build.
  command = "pnpm install --frozen-lockfile && pnpm run build"

[context.branch-deploy]
  # Branch deploys desativados: o painel Netlify deve estar configurado
  # como "None" em Branch deploys. Esta seção permanece apenas para
  # referência/override manual.
  command = "pnpm install --frozen-lockfile && pnpm run build"

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/sitemap*.xml"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.map"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
