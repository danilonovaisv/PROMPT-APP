version = 1
name = "prompt-app"

[setup]
script = '''
#!/usr/bin/env bash
set -euo pipefail

repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"

echo "==> Preparing Codex environment for PROMPT-APP"
echo "Repo: $repo_root"

# Ensure Node toolchain helpers are available when possible
if command -v corepack >/dev/null 2>&1; then
  corepack enable >/dev/null 2>&1 || true
fi

# Install dependencies using the lockfile/package manager detected in the repo
if [ -f package.json ]; then
  if [ -f pnpm-lock.yaml ]; then
    echo "==> Detected pnpm"
    if command -v pnpm >/dev/null 2>&1; then
      pnpm install --frozen-lockfile || pnpm install
    else
      npm install -g pnpm
      pnpm install --frozen-lockfile || pnpm install
    fi

  elif [ -f yarn.lock ]; then
    echo "==> Detected yarn"
    if command -v yarn >/dev/null 2>&1; then
      yarn install --immutable || yarn install
    else
      corepack prepare yarn@stable --activate >/dev/null 2>&1 || true
      yarn install --immutable || yarn install
    fi

  elif [ -f package-lock.json ]; then
    echo "==> Detected npm"
    npm ci || npm install

  elif [ -f bun.lockb ] || [ -f bun.lock ]; then
    echo "==> Detected bun"
    if command -v bun >/dev/null 2>&1; then
      bun install
    else
      npm install
    fi

  else
    echo "==> No lockfile detected, running npm install"
    npm install
  fi
fi

# Bootstrap env file only when the project provides a template
if [ ! -f .env.local ] && [ -f .env.example ]; then
  echo "==> Creating .env.local from .env.example"
  cp .env.example .env.local
fi

# Create local temp/work dir for Codex-specific artifacts
mkdir -p .codex/tmp

# Helpful status output
echo "==> Environment bootstrap finished"

if [ -f package.json ]; then
  echo
  echo "Available scripts:"
  node -e '
    try {
      const pkg = require("./package.json");
      const scripts = pkg.scripts || {};
      Object.keys(scripts).forEach((k) => console.log(`- ${k}: ${scripts[k]}`));
    } catch (e) {}
  ' || true
fi

echo
echo "Reminder:"
echo "- Fill .env.local with the project secrets before running the app"
echo "- Typical Supabase vars:"
echo "  NEXT_PUBLIC_SUPABASE_URL="
echo "  NEXT_PUBLIC_SUPABASE_ANON_KEY="
echo "  SUPABASE_SERVICE_ROLE_KEY="
'''

