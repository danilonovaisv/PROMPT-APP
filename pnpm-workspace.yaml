  - '@sentry-internal/feedback@10.56.0'
  - '@sentry-internal/replay-canvas@10.56.0'
  - '@sentry-internal/replay@10.56.0'
  - '@sentry/browser@10.56.0'
  - '@sentry/core@10.56.0'
  - '@sentry/react@10.56.0'
  - '@supabase/auth-js@2.107.0'
  - '@supabase/functions-js@2.107.0'
  - '@supabase/postgrest-js@2.107.0'
  - '@supabase/realtime-js@2.107.0'
  - '@supabase/storage-js@2.107.0'
  - '@supabase/supabase-js@2.107.0'
  - '@typescript-eslint/eslint-plugin@8.60.1 || 8.62.1'
  - '@typescript-eslint/parser@8.60.1 || 8.62.1'
  - '@typescript-eslint/project-service@8.60.1 || 8.62.1'
  - '@typescript-eslint/scope-manager@8.60.1 || 8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.60.1 || 8.62.1'
  - '@typescript-eslint/type-utils@8.60.1 || 8.62.1'
  - '@typescript-eslint/types@8.60.1 || 8.62.1'
  - '@typescript-eslint/typescript-estree@8.60.1 || 8.62.1'
  - '@typescript-eslint/utils@8.60.1 || 8.62.1'
  - '@typescript-eslint/visitor-keys@8.60.1 || 8.62.1'
  - typescript-eslint@8.60.1 || 8.62.1
  - eslint@10.5.0
  - lucide-react@1.18.0
  - eslint-plugin-react-refresh@0.5.3
  - react-router-dom@7.18.1
  - react-router@7.18.1
