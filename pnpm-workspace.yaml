packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  cbor-extract: true
  esbuild: true
  netlify-cli: true
  sharp: true
  supabase: true
  unix-dgram: true
  unrs-resolver: true

minimumReleaseAgeExclude:
