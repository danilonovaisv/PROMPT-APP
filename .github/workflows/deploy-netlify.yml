name: Deploy Netlify (Manual)

# ATENÇÃO:
# Este workflow é EXCLUSIVAMENTE manual (workflow_dispatch).
# O auto-deploy em push foi DESATIVADO em abril/2026 para evitar
# concorrência com o auto-publish nativo da integração Netlify ↔ GitHub,
# que estava gerando múltiplos builds simultâneos e esgotando a cota
# de minutos de build / bandwidth.
#
# Use este workflow apenas como:
#   1) Fallback manual caso o auto-publish do Netlify esteja desativado
#   2) Deploy forçado a partir de uma branch específica
#
# Acionamento: aba "Actions" do GitHub → "Deploy Netlify (Manual)" → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy em produção? (false = draft/preview)"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: deploy-netlify-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_VERSION: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validar segredos obrigatórios
        shell: bash
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "NETLIFY_AUTH_TOKEN e/ou NETLIFY_SITE_ID não configurados nos secrets." >&2
            exit 1
          fi

      - name: Pré-build
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm run build

      - name: Deploy (manual)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-deploy: ${{ github.event.inputs.production == 'true' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Manual deploy via workflow_dispatch (${{ github.actor }})"
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
