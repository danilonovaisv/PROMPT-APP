name: CI/CD

# Observação importante:
# Os jobs de deploy (preview e produção) foram REMOVIDOS deste workflow
# em abril/2026 para evitar múltiplos deploys concorrentes no Netlify
# (causando esgotamento de cota). O deploy em produção é feito UNICAMENTE
# pela integração nativa Netlify ↔ GitHub (auto-publish), e um fallback
# manual está disponível em `.github/workflows/deploy-netlify.yml`
# (workflow_dispatch).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test --coverage

      - name: Build
        run: pnpm run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
